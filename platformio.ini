[env:esp32dev_downldr]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
board_espidf.stack_size = 16384

; Modulo real: ESP32-WROVER-E (16MB). Sin esto el header de la imagen declara
; 4MB y el bootloader avisa en cada arranque ("Detected size(16384k) larger than
; the size in the binary image header(4096k)"). Mismo cambio que en musicbox;
; los dos firmwares conviven en el mismo chip y deben declarar lo mismo.
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions_dualapp.csv  ; 

upload_flags =
  --before
  default_reset
  --after
  hard_reset

build_src_filter = 
    +<downloader_main.cpp>        ; C++ main
    +<simibox_download.cpp>       ; C++ download
    +<simibox_boot_manager_idf.c> ; Pure C modules
    +<simibox_wifi_creds_idf.c>   
    +<simibox_led_idf.c>